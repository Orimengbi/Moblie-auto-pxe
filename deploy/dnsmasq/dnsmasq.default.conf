# 由 PXE 控制台生成。只监听装机网口。
# 装机阶段使用临时地址。项目里的机器进入对应地址池，其余机器使用未归类地址池。
port=0
interface=eth1
bind-interfaces
except-interface=lo
dhcp-authoritative
dhcp-range=tag:!pxeproject,192.168.77.50,192.168.77.200,255.255.255.0,12h
dhcp-option=tag:!pxeproject,option:router,192.168.77.1
dhcp-option=tag:!pxeproject,option:dns-server,192.168.77.1
enable-tftp
tftp-root=/data/tftp
dhcp-match=set:ipxe,175
dhcp-userclass=set:ipxe,iPXE
dhcp-match=set:efi,option:client-arch,7
dhcp-match=set:efi,option:client-arch,9
dhcp-match=set:bios,option:client-arch,0
dhcp-boot=tag:ipxe,http://192.168.77.1/boot/menu.ipxe
dhcp-boot=tag:efi,tag:!ipxe,ipxe.efi,,
dhcp-boot=tag:bios,tag:!ipxe,undionly.kpxe,,
dhcp-boot=tag:!ipxe,ipxe.efi,,
dhcp-leasefile=/data/dnsmasq/leases
log-dhcp
log-facility=-

