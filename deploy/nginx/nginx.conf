server {
    listen 80;
    server_name _;
    absolute_redirect off;
    client_max_body_size 0;

    location /images/ {
        alias /data/images/;
    }

    location /diag/ {
        alias /data/diag/;
    }

    location /boot/ {
        proxy_pass http://console:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    location = / {
        return 302 http://$host:43123/;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 远程控制台：转到控制台进程里的 BMC 代理（console:3001），包括 KVM 的 WebSocket。
server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/kvm/cert.pem;
    ssl_certificate_key /etc/nginx/kvm/key.pem;
    client_max_body_size 0;

    location / {
        proxy_pass http://console:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
