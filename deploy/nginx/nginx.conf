# 装机口：只给目标机启动文件、镜像和诊断包，明文 HTTP（iPXE 和安装程序认不了自建证书）。
server {
    listen 80;
    server_name _;
    absolute_redirect off;
    client_max_body_size 0;

    location /images/ {
        alias /data/images/;
    }

    location /diag/ {
        alias /data/diag/;
    }

    location /boot/ {
        proxy_pass http://console:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 控制台按来源地址决定给不给应答文件；覆盖掉客户端自己带的。
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    location = / {
        return 302 https://$host:43123/;
    }

    location / { return 404; }
}

# 控制台：HTTPS，证书见 tls-init.sh。同一端口上用 http:// 打开的跳到 https://。
server {
    listen 43123 ssl;
    server_name _;
    absolute_redirect off;
    client_max_body_size 0;

    ssl_certificate /tls/active.crt;
    ssl_certificate_key /tls/active.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:pxe_tls:1m;
    error_page 497 =301 https://$host:$server_port$request_uri;

    location /images/ { return 404; }
    location /diag/ { return 404; }
    location /boot/ { return 404; }

    # 自建的根证书，浏览器导入一次就不再报不安全。登录页有链接。
    location = /pxe-ca.crt {
        alias /tls/ca.crt;
        default_type application/x-x509-ca-cert;
        add_header Content-Disposition 'attachment; filename="pxe-ca.crt"';
    }

    # 远程控制台：嵌在控制台页面里的 BMC 画面，转到控制台进程里的代理，包括 KVM 的 WebSocket。
    location /__bmc/ {
        proxy_pass http://console:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        # 审计记真实地址；控制台只信从这里来的 X-Real-IP。
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://console:3000;
        proxy_http_version 1.1;
        # 带端口的 Host 给控制台核对 Origin；X-Real-IP 给登录失败限速；X-Forwarded-Proto 让登录 cookie 带上 Secure。
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
