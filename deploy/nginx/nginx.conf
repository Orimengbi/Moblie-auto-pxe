# Image download, boot files and reports stay on the install NIC.
server {
    listen 192.168.77.1:8080;
    server_name _;
    absolute_redirect off;
    client_max_body_size 0;

    location /images/ {
        alias /data/images/;
    }

    location /diag/ {
        alias /data/diag/;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }
}

# Console from the management network. No images, boot files or reports.
server {
    listen 127.0.0.1:8080 default_server;
    listen 192.168.68.119:8080;
    server_name _;
    absolute_redirect off;
    client_max_body_size 0;

    location /images/ { return 404; }
    location /diag/ { return 404; }
    location /boot/ { return 404; }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 远程控制台：转到控制台进程里的 BMC 代理（console:3001），包括 KVM 的 WebSocket。
server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/kvm/cert.pem;
    ssl_certificate_key /etc/nginx/kvm/key.pem;
    client_max_body_size 0;

    location / {
        proxy_pass http://console:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}
