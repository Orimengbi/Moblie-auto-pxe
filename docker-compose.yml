services:
  dnsmasq:
    build: ./deploy/dnsmasq
    network_mode: host
    cap_add:
      - NET_ADMIN
    volumes:
      - ./data:/data
    restart: unless-stopped

  boot:
    build: ./deploy/nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./data:/data:ro
    depends_on:
      - console
    restart: unless-stopped

  console:
    build: ./console
    ports:
      - "43123:3000"
    environment:
      PXE_DATA_DIR: /data
      PORT: "3000"
    volumes:
      - ./data:/data
    restart: unless-stopped
