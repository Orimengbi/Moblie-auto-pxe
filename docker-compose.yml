services:
  dnsmasq:
    build: ./deploy/dnsmasq
    network_mode: host
    cap_add:
      - NET_ADMIN
    volumes:
      - ./data:/data
    restart: unless-stopped

  boot:
    build: ./deploy/nginx
    # 80 是装机口（明文），43123 是控制台（HTTPS，nginx 转给 console）。
    ports:
      - "80:80"
      - "43123:43123"
    environment:
      # 控制台证书里的地址（浏览器访问控制台用的 IP 或域名），逗号隔开。
      PXE_TLS_HOSTS: ${PXE_TLS_HOSTS:-}
    volumes:
      - ./data:/data:ro
      - ./data/tls:/tls
    depends_on:
      - console
    restart: unless-stopped

  console:
    build:
      context: ./console
      # 部署脚本按「日期-提交号」传进来，「备份和升级」页和 /api/health 显示它。
      args:
        PXE_VERSION: ${PXE_VERSION:-dev}
    # 不直接对外：浏览器经 boot 的 43123（HTTPS）访问。
    environment:
      PXE_DATA_DIR: /data
      PORT: "3000"
    volumes:
      - ./data:/data
    restart: unless-stopped
