services:
  dnsmasq:
    build: ./deploy/dnsmasq
    network_mode: host
    cap_add:
      - NET_ADMIN
    volumes:
      - ./data:/data
    restart: unless-stopped

  boot:
    build: ./deploy/nginx
    network_mode: host
    volumes:
      - ./data:/data:ro
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - console
    restart: unless-stopped

  console:
    build: ./console
    network_mode: host
    environment:
      PXE_DATA_DIR: /data
      PORT: "3000"
      HOSTNAME: 127.0.0.1
    volumes:
      - ./data:/data
    restart: unless-stopped
