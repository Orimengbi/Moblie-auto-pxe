services:
  dnsmasq:
    build: ./deploy/dnsmasq
    network_mode: host
    cap_add:
      - NET_ADMIN
    volumes:
      - ./data:/data
    restart: unless-stopped

  boot:
    build: ./deploy/nginx
    ports:
      - "80:80"
    volumes:
      - ./data:/data:ro
    depends_on:
      - console
    restart: unless-stopped

  console:
    build: ./console
    ports:
      - "43123:3000"
    environment:
      PXE_DATA_DIR: /data
      PORT: "3000"
      # 控制台在 43123，远程控制台经 nginx 的 80 端口转发。
      PXE_BMC_PORT: "80"
    volumes:
      - ./data:/data
    restart: unless-stopped
