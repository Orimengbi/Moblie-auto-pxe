# 正式环境用的 compose 文件，由 pxectl 装到安装目录（默认 /opt/pxe）。
# 镜像从升级包里导入，不在这台机器上构建；版本号在同目录的 .env（PXE_VERSION）里，pxectl 升级、回滚时改它。
services:
  dnsmasq:
    image: pxe/dnsmasq:${PXE_VERSION}
    network_mode: host
    cap_add:
      - NET_ADMIN
    volumes:
      - ./data:/data
    restart: unless-stopped

  boot:
    image: pxe/boot:${PXE_VERSION}
    network_mode: host
    volumes:
      - ./data:/data:ro
      # 控制台 HTTPS 的证书，启动时自动生成；证书里的地址读 data/tls/hosts（pxectl 按 site.env 写）。
      - ./data/tls:/tls
      # pxectl 按 site.env 生成；单文件挂载，改了要重启 boot 才生效（pxectl 会做）。
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - console
    restart: unless-stopped

  console:
    image: pxe/console:${PXE_VERSION}
    network_mode: host
    environment:
      PXE_DATA_DIR: /data
      PORT: "3000"
      HOSTNAME: 127.0.0.1
      PXE_HOSTNAME: ${PXE_HOSTNAME:-}
    volumes:
      - ./data:/data
    restart: unless-stopped
